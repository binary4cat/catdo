[package]
name = "catdo"
version = "0.1.1"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
notify = "7.0"
rust-embed = "8.5"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mime_guess = "2.0"
tower-http = { version = "0.6", features = ["cors"] }
futures = "0.3"
notify-debouncer-mini = "0.5"
sha2 = "0.10"
parking_lot = "0.12"

[profile.release]
strip = true
lto = true
