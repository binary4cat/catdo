name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: catdo-windows-x64.zip
            binary: catdo.exe
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: catdo-linux-x64.tar.gz
            binary: catdo
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: catdo-linux-arm64.tar.gz
            binary: catdo
          - name: macos-x64
            os: macos-13
            target: x86_64-apple-darwin
            archive: catdo-macos-x64.tar.gz
            binary: catdo
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            archive: catdo-macos-arm64.tar.gz
            binary: catdo

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend assets
        working-directory: web
        run: npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux ARM64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install --yes gcc-aarch64-linux-gnu

      - name: Build binary
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package archive
        shell: bash
        run: |
          mkdir -p artifacts
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "artifacts/${{ matrix.archive }}" "$binary"
          else
            tar -C "$(dirname "$binary")" -czf "artifacts/${{ matrix.archive }}" "$(basename "$binary")"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: catdo-${{ matrix.name }}
          path: artifacts/${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: catdo-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum *.tar.gz *.zip > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
